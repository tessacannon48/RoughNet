name: RoughNet CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/roughnet-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: cffconvert --validate
