# Analysis settings are frozen at prepare; style can change at any time.
sets:
  corrected:
    type: cache
    study: reconstructions/noise_sampler_clean
    schedule: cosine
    sampler: plms
# Optional colleague/submitted/ensemble tiles (requires all selected IDs):
#  submitted:
#    type: geotiff
#    prediction_domain: raw  # raw: subtract GT patch mean; residual: already demeaned
#    gt_dirs: {tuk: input_data/lidar_patches_tuk}
#    pred_dirs: {tuk: /path/to/pred_tiles}
split_ids: splits/train_val_split_ids.json
analysis:
  seed: 42
  pixel_size_m: 1.0
  min_valid: 2000
  mad_k: null  # Notebook used 50; null preserves canonical evaluation support.
  variogram_samples: 2000
  lag_width_m: 4.0
  max_lag_m: 200.0
  max_range_m: 400.0
  fit_samples: 5000
  histogram_range_m: [-2.0, 3.0]
  histogram_bins: 500
  exploratory_proxies: false  # Illustrative thresholds, not validated traversability.
  sigma_class_edges_m: [0.05, 0.10, 0.20]
  ridge_height_m: 0.35
style:
  main_set: corrected
  patch_region: tuk
  patch_id: '12556'
  formats: [png, pdf]
  dpi: 300
  font_family: DejaVu Sans
  font_size: 11
  title_size: 13
  legend_size: 9
  region_colors: {pondinlet: '#2a78d6', tuk: '#d62728', cambridge: '#1baf7a'}
  region_markers: {pondinlet: o, tuk: s, cambridge: '^'}
  gt_color: black
  prediction_color: royalblue
  family_colors: {Normal: lightcoral, Skew: forestgreen, Gamma: magenta, Log-normal: navy}
  colormap: RdBu_r
  elevation_limit_m: 0.5
  elevation_norm: symlog  # linear matches the supplied notebook
  elevation_linthresh_m: 0.1
  rotate_quarters: 1
  patch_figsize: [15, 15]
  extended_roughness_figsize: [18, 5.5]  # Original a/c/f, relabelled a/b/c
  roughness_width_ratios: [1.15, 1.15, 1]
  extended_structure_figsize: [18, 5.5]  # Original b/d/e, relabelled a/b/c
  extended_wpad: 2.5  # Automatic spacing accounts for long class tick labels
  jsd_yscale: log
  jsd_ylim: null
  patch_legend_location: upper right
  patch_height_ratios: [3.6, 2.0, 2.0]
  hspace: 0.35
  wspace: 0.30
  histogram_bins: 120
  density_yscale: log
  density_ylim: [0.001, 20]
  pooled_xlim: [-1, 2]
  pooled_ylim: [0.0001, 30]
  scatter_size: 10
  scatter_alpha: 0.35
  line_width: 2
  best_fit_line_width: 3
  grid_alpha: 0.25
  show_titles: true
  show_legend: true
  patch_map_titles: [LiDAR, RoughNet prediction]
  patch_density_titles: [LiDAR distribution, Prediction distribution]
  variogram_title: Empirical points and exponential fits
  extended_titles:
    - '(a) Patch roughness amplitude'
    - '(b) Variogram effective range'
    - '(c) Pooled regional densities'
    - '(d) Distribution mismatch'
    - '(e) Best candidate family'
    - '(f) Roughness-class agreement'
  sigma_limits_cm: null  # null: derive positive plotting limits from the data
  extended_panel_f: roughness_classes  # roughness_classes or acf
  sigma_class_edges_m: [0.05, 0.10, 0.20]
  sigma_class_labels: ['Smooth <5 cm', 'Low 5–10 cm', 'Moderate 10–20 cm', 'Rough ≥20 cm']
  confusion_colormap: Blues
  metrics_box_font_family: monospace
  metrics_box_font_size: 10
  metrics_box_padding: 1.0
  metrics_box_facecolor: whitesmoke
  metrics_box_edgecolor: gray
